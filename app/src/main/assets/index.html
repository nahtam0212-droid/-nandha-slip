<!DOCTYPE html>
<html lang="ta"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nandha Refinery - Silver Sample Slip</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f1ede5;color:#222}
h1{font-size:18px;margin:0;padding:12px 14px;background:#7a1f4d;color:#fff}
.wrap{padding:12px;max-width:760px;margin:auto}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;font-weight:600;color:#7a1f4d}
input{width:100%;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:8px;margin-top:3px}
.full{grid-column:1/3}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
button{flex:1;min-width:130px;padding:12px;font-size:15px;border:0;border-radius:8px;background:#7a1f4d;color:#fff;font-weight:600}
button.alt{background:#1b5e3a}
canvas{width:100%;height:auto;background:#fff;border:1px solid #ccc;display:block}#printimg{display:none}
@media print{@page{size:A5 landscape;margin:0}body{background:#fff}h1,.form,.btns{display:none}.wrap{padding:0;max-width:none}canvas{display:none}#printimg{display:block;width:100%;height:auto}}
</style></head><body>
<h1>Nandha Refinery – Silver Sample Slip</h1>
<div class="wrap">
<div class="form grid">
<div><label>S.No (வரிசை எண்)<input id="sno" inputmode="numeric"></label></div>
<div><label>Date (தேதி)<input id="date" type="date"></label></div>
<div class="full"><label>M/s (கிளையண்ட் பெயர்)<input id="ms" autocomplete="off"></label></div>
<div class="full"><label>M/s – 2nd line (ஊர் / முகவரி)<input id="ms2" autocomplete="off"></label></div>
<div class="full"><label>Fineness<input id="fine" autocomplete="off"></label></div>
<div><label>W<input id="w" inputmode="decimal"></label></div>
<div><label>T<input id="t" inputmode="decimal"></label></div>
<div class="full"><label>P<input id="p" inputmode="decimal"></label></div>
<div class="full"><label>ஜுவல்லரி படம் (Jewellery image upload)<input id="img" type="file" accept="image/*"></label></div>
</div>
<div class="btns">
<button onclick="doPrint()">🖨 Print</button>
<button class="alt" id="shareBtn" onclick="doShare()">📤 Save / Share Image</button>
<button class="alt" onclick="nextSlip()">➕ Next Slip (S.No +1)</button>
</div>

ids.forEach(i=>$(i).addEventListener('input',()=>{draw();if(i!=='date')store('f_'+i,$(i).value)}));
function init(){
 $('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
 $('sno').value=load('f_sno')||'1';draw()}
function nextSlip(){
 const n=(parseInt($('sno').value)||0)+1;
 ['ms','ms2','fine','w','t','p'].forEach(i=>{$(i).value='';store('f_'+i,'')});userImg=null;$('img').value='';
 $('sno').value=n;store('f_sno',n);init2();draw();scrollTo(0,0)}
function init2(){$('date').value=new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10)}
function doPrint(){draw();const im=$('printimg'),go=()=>{window.AndroidPrint?AndroidPrint.print():window.print()};im.src=c.toDataURL('image/png');(im.decode?im.decode():Promise.resolve()).then(go,go)}
$('img').addEventListener('change',e=>{const f=e.target.files[0];if(!f){userImg=null;draw();return}const r=new FileReader();r.onload=()=>{const m=new Image();m.onload=()=>{userImg=m;draw()};m.src=r.result};r.readAsDataURL(f)});
if(window.AndroidPrint)$('shareBtn').style.display='none';
function blob(){return new Promise(r=>c.toBlob(r,'image/png'))}
async function doShare(){
 draw();const b=await blob(),name='slip_'+($('sno').value||'0')+'.png',f=new File([b],name,{type:'image/png'});
 if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return}catch(e){}}
 const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();a.remove()}
init();
